  <text class="serif" x="56" y="156" fill="#171613" font-size="46" font-weight="500" letter-spacing="-0.8">Full-Stack Software Engineer</text>
  <text class="serif" x="56" y="202" fill="#171613" fill-opacity="0.82" font-size="26" letter-spacing="-0.3">Web, mobile, APIs, and production systems.</text>

  <text class="sans" x="56" y="250" fill="#63594c" font-size="15">I build and ship web and mobile products with React, Node.js, APIs, databases,</text>
  <text class="sans" x="56" y="272" fill="#63594c" font-size="15">payments, AI workflows, and Web3 integrations &#8212; from scoped MVPs to production retainers.</text>

  <path d="M56 312H904" stroke="#171613" stroke-opacity="0.12"/>

  <text class="sans" x="56" y="352" fill="#171613" font-size="13" font-weight="600">Software Engineer at System Logic</text>
  <text class="sans" x="310" y="352" fill="#171613" font-size="13" font-weight="600">Live production products</text>
  <text class="sans" x="520" y="352" fill="#171613" font-size="13" font-weight="600">Web &amp; mobile</text>
  <text class="sans" x="680" y="352" fill="#171613" font-size="13" font-weight="600">APIs &amp; Supabase</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Adil Masood &#8212; Full-Stack Software Engineer</title>
  <desc id="desc">Web, mobile, APIs, and production systems. Software Engineer at System Logic.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#171613" stroke-opacity="0.055"/>
    </pattern>
    <radialGradient id="glow" cx="0.42" cy="0" r="0.9">
      <stop offset="0" stop-color="#8a6a35" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#8a6a35" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8a6a35" stop-opacity="0"/>

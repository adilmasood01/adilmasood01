    <path d="M21 33L29.5 42" stroke="#f8f6f1" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M38.5 51.8L48 62" stroke="#f8f6f1" stroke-width="7.5" stroke-linecap="round"/>

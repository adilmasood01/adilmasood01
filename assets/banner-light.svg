    <rect x="1" y="1" width="94" height="94" rx="22" fill="#0a0a0b" stroke="#c9a877" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M21 74V33" stroke="#f8f6f1" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M75 33V74" stroke="#f8f6f1" stroke-width="7.5" stroke-linecap="round"/>
